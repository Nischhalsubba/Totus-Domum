<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Totus Domum repository thumbnail</title>
  <desc id="desc">A luxury editorial thumbnail for the Totus Domum home management website using black, alabaster, and muted gold.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="0.58" stop-color="#1C1C1C"/>
      <stop offset="1" stop-color="#30281D"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="65%">
      <stop offset="0" stop-color="#C6A87C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#C6A87C" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="972" cy="142" r="170" fill="#C6A87C" opacity="0.08" filter="url(#soft)"/>

  <g opacity="0.22" stroke="#F2F0E9" fill="none">
    <path d="M760 92h318v446H760z"/>
    <path d="M790 122h258v386H790z"/>
    <path d="M919 122v386"/>
    <path d="M790 315h258"/>
  </g>

  <g transform="translate(84 86)">
    <text x="0" y="0" fill="#C6A87C" font-family="Montserrat,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="7">LUXURY HOME MANAGEMENT</text>
    <rect x="0" y="35" width="88" height="2" fill="#C6A87C"/>

    <text x="0" y="148" fill="#F2F0E9" font-family="Georgia,serif" font-size="92">Totus</text>
    <text x="0" y="238" fill="#F2F0E9" font-family="Georgia,serif" font-size="92" font-style="italic">Domum</text>

    <text x="2" y="304" fill="#C6A87C" font-family="Georgia,serif" font-size="34" font-style="italic">The invisible art of living.</text>

    <text x="2" y="372" fill="#F2F0E9" opacity="0.72" font-family="Montserrat,Arial,sans-serif" font-size="18" letter-spacing="1">REACT · TYPESCRIPT · TAILWIND · FRAMER MOTION</text>

    <g transform="translate(0 418)">
